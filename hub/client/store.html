<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget Hub</title>
<script>
// Match the current TrueNAS theme (same origin -> same localStorage) instead of a fixed
// dark palette, using the same two keys TrueNAS's own index.html reads on load. The rest
// of the styling (fonts, cards, buttons) lives in CW.renderStore's own CSS in lib.js,
// shared with the embedded dashboard panel -- this page just bootstraps it.
(function () {
  var bg1 = localStorage.getItem("bg1"), fg1 = localStorage.getItem("fg1");
  document.documentElement.style.setProperty("--bg1", bg1 || "#11161e");
  document.documentElement.style.setProperty("--fg1", fg1 || "#e6edf3");
})();
</script>
<style>
:root{color-scheme:dark}
html,body{margin:0;background:var(--bg1,#11161e)}
body{padding:24px;max-width:820px;margin:0 auto;font-family:var(--font-family-body,"IBM Plex Sans",Roboto,Arial,sans-serif)}
h1{font-family:var(--font-family-header,"Titillium Web",Roboto,Arial,sans-serif);font-size:20px;margin:0 0 4px;color:var(--fg1,#e6edf3)}
</style>
<script src="/cw/lib.js"></script>
</head>
<body>
<h1>TrueNAS Community Widgets</h1>
<p style="color:var(--fg2,#9aa4af);margin:0 0 20px;font-size:13px">Install, update and remove dashboard widgets. After installing, add one from the dashboard via <b>Configure → Add → Custom</b>.</p>
<div id="cw-store-root"></div>
<script>
(function wait() {
  if (window.CW && CW.renderStore) return CW.renderStore(document.getElementById("cw-store-root"));
  setTimeout(wait, 30);
})();
</script>
</body></html>
