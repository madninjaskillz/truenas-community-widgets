name: Validate catalog
on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata + catalog integrity (no rebuild)
        run: |
          python3 -m pip install --quiet jsonschema
          python3 - <<'PY'
          import json, glob, hashlib, os, sys, jsonschema
          schema = json.load(open("schema/metadata.schema.json"))
          cat = {w["id"]: w for w in json.load(open("catalog.json"))["widgets"]}
          ok = True
          for m in sorted(glob.glob("widgets/*/metadata.json")):
              meta = json.load(open(m)); jsonschema.validate(meta, schema)
              e = cat.get(meta["id"])
              if not e:
                  print("::error:: %s missing from catalog.json" % meta["id"]); ok = False; continue
              if not os.path.isfile(e["zip"]):
                  print("::error:: missing zip %s" % e["zip"]); ok = False; continue
              if hashlib.sha256(open(e["zip"], "rb").read()).hexdigest() != e["sha256"]:
                  print("::error:: sha256 mismatch for %s — run build_catalog.py and commit" % meta["id"]); ok = False
              else:
                  print("ok", meta["id"])
          sys.exit(0 if ok else 1)
          PY
