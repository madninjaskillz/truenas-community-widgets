name: Build Hub image
on:
  push:
    branches: [main]
    paths: ["hub/**", ".github/workflows/build-image.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./hub
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cw-hub:latest
            ghcr.io/${{ github.repository_owner }}/cw-hub:${{ github.sha }}
